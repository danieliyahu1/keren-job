services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    env_file:
      - .env
    volumes:
      # Persist opencode state (sessions, credentials) so the container keeps
      # nothing on the host.
      - opencode-data:/home/opencode/.local/share/opencode
    networks:
      - kerenjob-net

  kerenjob:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OPENCODE_BASE_URL=http://opencode:4096
      - OPENCODE_AUTO_START=false
    depends_on:
      - opencode
    networks:
      - kerenjob-net

networks:
  kerenjob-net:
    driver: bridge

volumes:
  opencode-data:
