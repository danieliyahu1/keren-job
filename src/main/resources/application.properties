server.port=${PORT:8080}
spring.application.name=keren-job
spring.mvc.async.request-timeout=600000
app.opencode.base-url=${OPENCODE_BASE_URL:http://localhost:4096}
app.opencode.timeout-seconds=${OPENCODE_TIMEOUT_SECONDS:600}
app.opencode.auto-start=${OPENCODE_AUTO_START:true}
app.opencode.command=${OPENCODE_COMMAND:opencode.cmd}
app.opencode.args=${OPENCODE_ARGS:serve,--port,4096}
app.opencode.working-directory=${OPENCODE_WORKING_DIR:agent}
app.opencode.startup-timeout-seconds=${OPENCODE_STARTUP_TIMEOUT:30}
