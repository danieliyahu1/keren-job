<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keren Job</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <main>
        <h1>Keren Job</h1>

        <div id="conversation" class="conversation">
            <p id="empty-state" class="empty-state">Describe your next job. I'll find it.</p>
        </div>

        <div id="loading" class="htmx-indicator">
            <div class="turn turn-assistant">
                <div class="bubble typing">Looking for your next job&hellip;</div>
            </div>
        </div>

        <div id="validation-message" hidden>
            <p>Please describe the job you are looking for.</p>
        </div>

        <form id="composer"
              class="composer"
              hx-post="/api/search"
              hx-target="#conversation"
              hx-swap="beforeend"
              hx-indicator="#loading">
            <textarea name="query"
                      rows="2"
                      autofocus
                      placeholder="Describe the job you want"></textarea>
            <button type="submit">Send</button>
        </form>
    </main>

    <script>
        var form = document.getElementById("composer");
        var button = form.querySelector("button");
        var textarea = form.querySelector("textarea");
        var validationMessage = document.getElementById("validation-message");
        var conversation = document.getElementById("conversation");
        var emptyState = document.getElementById("empty-state");

        function scrollToLatest() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
        }

        function appendUserMessage(text) {
            var turn = document.createElement("div");
            turn.className = "turn turn-user";
            var bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;
            turn.appendChild(bubble);
            conversation.appendChild(turn);
            if (emptyState) {
                emptyState.hidden = true;
            }
        }

        form.addEventListener("submit", function (event) {
            if (textarea.value.trim() === "") {
                event.preventDefault();
                validationMessage.hidden = false;
                return;
            }
            appendUserMessage(textarea.value);
            validationMessage.hidden = true;
            document.querySelectorAll(".question-card:not(.answered)")
                .forEach(function (card) { card.classList.add("answered"); });
            scrollToLatest();
        });

        textarea.addEventListener("input", function () {
            validationMessage.hidden = true;
        });

        textarea.addEventListener("keydown", function (event) {
            if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        document.body.addEventListener("htmx:beforeRequest", function (event) {
            if (event.detail.elt !== form) {
                return;
            }
            button.disabled = true;
            button.textContent = "Sending\u2026";
        });

        document.body.addEventListener("htmx:afterRequest", function (event) {
            // The value must survive until htmx reads the form; clear it once the request is out.
            if (event.detail.elt === form) {
                textarea.value = "";
            }
            button.disabled = false;
            button.textContent = "Send";
            scrollToLatest();
        });
    </script>
</body>
</html>
