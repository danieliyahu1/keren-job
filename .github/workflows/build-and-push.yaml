# Builds both kerenjob images for the OCI k3s box (Ampere / arm64), then pins the
# digests into deploy/deployment.yaml and commits that pin. Argo CD deploys the
# pinned commit; the pin commit itself never rebuilds anything.
#
# Two images, because the app is two processes:
#   ghcr.io/<repo>            Spring Boot UI/API
#   ghcr.io/<repo>-opencode   OpenCode agent runtime with Playwright + Chromium
#
# The opencode image is only rebuilt when its inputs change. Every rebuild
# produces a new digest the VM has to pull (~1 GB), and the box has no image GC,
# so republishing it on every app-only commit would fill the disk.
name: build-and-push

on:
  push:
    branches: [master]
    paths-ignore:
      - deploy/**
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_opencode:
        description: Rebuild and publish the opencode sidecar even if its inputs did not change
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ${{ github.repository }}
  OPENCODE_IMAGE: ${{ github.repository }}-opencode

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      opencode: ${{ steps.filter.outputs.opencode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            opencode:
              - 'Dockerfile.opencode'
              - 'opencode-entrypoint.sh'
              - 'agent/**'
              - '.dockerignore'

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: bash ./mvnw -B -ntp verify

      - name: Validate Kubernetes manifest schema
        run: |
          docker run --rm -v "$PWD/deploy:/deploy" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -ignore-missing-schemas -summary /deploy

      - name: Validate delivery contract (image pin, probes, scrape, dashboard)
        run: node scripts/validate-deploy.mjs

  build:
    # Publish only for a real push to master: never a PR, never the bot's own
    # manifest-pin commit, never a manual run from another branch.
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/master'
    needs: [changes, verify]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      opencode_digest: ${{ steps.opencode.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: app-meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        id: app
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # Start it the way the pod runs it (non-root, read-only rootfs, writable
      # /tmp) and prove it boots, serves the UI, and exposes the metrics the
      # dashboard and VMServiceScrape depend on.
      - name: Smoke test the app image
        run: |
          REF="${REGISTRY}/${APP_IMAGE}:sha-${GITHUB_SHA}"
          docker run -d --name kerenjob-app-smoke \
            --read-only --tmpfs /tmp:rw,size=32m \
            -e PORT=8080 -e METRICS_PORT=9090 \
            -p 18080:8080 -p 19090:9090 "${REF}"
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:19090/actuator/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "health: $(curl -fsS http://127.0.0.1:19090/actuator/health)"
          curl -fsS http://127.0.0.1:18080/ | grep -q 'Keren Job'
          curl -fsS http://127.0.0.1:19090/actuator/prometheus | grep -q '^jvm_memory_used_bytes'

      - name: Smoke test app logs
        if: failure()
        run: docker logs kerenjob-app-smoke

      - name: Clean up app smoke test
        if: always()
        run: docker rm -f kerenjob-app-smoke || true

      - uses: docker/metadata-action@v5
        id: opencode-meta
        if: needs.changes.outputs.opencode == 'true' || inputs.rebuild_opencode == true
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPENCODE_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        id: opencode
        if: needs.changes.outputs.opencode == 'true' || inputs.rebuild_opencode == true
        with:
          context: .
          file: Dockerfile.opencode
          platforms: linux/arm64
          push: true
          tags: ${{ steps.opencode-meta.outputs.tags }}
          labels: ${{ steps.opencode-meta.outputs.labels }}
          cache-from: type=gha,scope=opencode
          cache-to: type=gha,mode=max,scope=opencode

      # The sidecar image is the one with real portability risk: it must install
      # Playwright's arm64 Chromium and reach `/global/health` as a non-root user.
      - name: Smoke test the opencode image
        if: needs.changes.outputs.opencode == 'true' || inputs.rebuild_opencode == true
        run: |
          REF="${REGISTRY}/${OPENCODE_IMAGE}:sha-${GITHUB_SHA}"
          docker run -d --name kerenjob-opencode-smoke \
            -e LINKEDIN_EMAIL=smoke-test -e LINKEDIN_PASSWORD=smoke-test \
            -e OPENCODE_API_KEY=smoke-test \
            -p 14096:4096 "${REF}"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:14096/api/info >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "health: $(curl -fsS http://127.0.0.1:14096/api/info)"
          docker exec kerenjob-opencode-smoke sh -c 'find /ms-playwright -name chrome -type f | head -n 1' | grep -q .
          docker exec kerenjob-opencode-smoke sh -c 'grep -q smoke-test /home/opencode/.config/opencode/skills/linkedin-jobs/SKILL.md'

      - name: Smoke test opencode logs
        if: failure() && (needs.changes.outputs.opencode == 'true' || inputs.rebuild_opencode == true)
        run: docker logs kerenjob-opencode-smoke

      - name: Clean up opencode smoke test
        if: always() && (needs.changes.outputs.opencode == 'true' || inputs.rebuild_opencode == true)
        run: docker rm -f kerenjob-opencode-smoke || true

  update-manifest:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/master'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the exact commit this image was built from, so the pin commit is
      # a direct child even if master moved while the image built.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Pin manifests to the published images
        env:
          APP_DIGEST: ${{ needs.build.outputs.app_digest }}
          OPENCODE_DIGEST: ${{ needs.build.outputs.opencode_digest }}
        run: |
          if [ -z "${APP_DIGEST}" ]; then
            echo "build job did not report an app image digest" >&2
            exit 1
          fi
          APP_REF="${REGISTRY}/${APP_IMAGE}:sha-${GITHUB_SHA}@${APP_DIGEST}"
          PINS=("${REGISTRY}/${APP_IMAGE}=${APP_REF}")
          if [ -n "${OPENCODE_DIGEST}" ]; then
            PINS+=("${REGISTRY}/${OPENCODE_IMAGE}=${REGISTRY}/${OPENCODE_IMAGE}:sha-${GITHUB_SHA}@${OPENCODE_DIGEST}")
          fi
          node scripts/update-manifest.mjs deploy/deployment.yaml "${PINS[@]}"

      - name: Commit manifest handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin image to ${GITHUB_SHA}"
          git push origin HEAD:master
