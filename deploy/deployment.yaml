# kerenjob — one pod, two containers that belong together:
#
#   app       Spring Boot UI/API on 8080, operational endpoints on 9090.
#   opencode  `opencode serve` on 4096: the agent runtime that searches HireMe's
#             public JSON API. The app reaches it on loopback, which is why they
#             share a pod instead of a Service.
#
# Both images are pinned to the triggering commit SHA and the registry digest.
# The build-and-push workflow publishes them and rewrites these two lines, so the
# deployed bytes are immutable while the source commit stays readable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kerenjob
  namespace: kerenjob
  labels:
    app: kerenjob
    app.kubernetes.io/name: kerenjob
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the pod holds the agent session and the node is
  # shared; a second full pod during rollout is how the 12 GB box OOMs.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kerenjob
  template:
    metadata:
      labels:
        app: kerenjob
        app.kubernetes.io/name: kerenjob
    spec:
      # The pod never talks to the Kubernetes API, so no token is mounted.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/danieliyahu1/keren-job:sha-06ddf65f24732f2d842b16c2875ddbd335f7598f@sha256:9ac91476c71451ad755435961518f99da6d09d1a09f46ccabf9db9cc10817068
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: kerenjob-config
          env:
            # The V2 server always requires HTTP Basic auth (user "opencode"), so
            # the client shares the same password as the sidecar below.
            - name: OPENCODE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kerenjob-secrets
                  key: opencode-password
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Let the tunnel stop sending new requests before the listener closes.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: metrics }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: metrics }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: metrics }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: app-tmp
              mountPath: /tmp

        - name: opencode
          image: ghcr.io/danieliyahu1/keren-job-opencode:sha-761542c91ebdcb8c1bfc6cb914d72ce4b0ccf4a4@sha256:0cc1f3ba1c43c5b9df71fb9fcbc74fb307d63c72a926db5a774ff2abcef47083
          imagePullPolicy: IfNotPresent
          ports:
            - name: opencode
              containerPort: 4096
          env:
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kerenjob-secrets
                  key: opencode-api-key
            # The V2 server uses this as its HTTP Basic password instead of
            # generating a random one at startup.
            - name: OPENCODE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kerenjob-secrets
                  key: opencode-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The CLI keeps its state on the mounted emptyDirs. It is unprivileged:
          # the image runs as the numeric non-root user below, with no capabilities.
          securityContext:
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The V2 server answers /api/info with 401 unless the request carries HTTP
          # Basic auth (user "opencode", password OPENCODE_PASSWORD). A plain
          # httpGet probe cannot send a secret, so the check runs inside the
          # container and reads the password from its own environment.
          startupProbe:
            exec:
              command: ["/usr/local/bin/node", "-e", "fetch('http://127.0.0.1:4096/api/info',{headers:{authorization:'Basic '+Buffer.from('opencode:'+(process.env.OPENCODE_PASSWORD||'')).toString('base64')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/usr/local/bin/node", "-e", "fetch('http://127.0.0.1:4096/api/info',{headers:{authorization:'Basic '+Buffer.from('opencode:'+(process.env.OPENCODE_PASSWORD||'')).toString('base64')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # No liveness probe on purpose: a long search must not be SIGKILLed
          # mid-run. Readiness covers it.
          volumeMounts:
            - name: opencode-tmp
              mountPath: /tmp
            - name: opencode-state
              mountPath: /home/opencode/.local/share/opencode
      volumes:
        - name: app-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: opencode-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: opencode-state
          emptyDir:
            sizeLimit: 128Mi
