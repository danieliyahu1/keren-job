# Maps two OCI Vault entries into the kerenjob-secrets Kubernetes Secret. What
# is in Git is a NAME, never a value: the VM proves its identity (instance
# principal) to OCI and fetches the values at runtime.
#
# The vault entry names follow the platform's instance_name (default k3s-01) and
# must match the entries created in OCI Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kerenjob-secrets
  namespace: kerenjob
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kerenjob-secrets
    creationPolicy: Owner
  data:
    # Credential for the free opencode/* model used by the agent.
    - secretKey: opencode-api-key
      remoteRef:
        key: k3s-01-kerenjob-opencode-api-key
    # Shared HTTP Basic password for the OpenCode V2 server (user "opencode").
    # The container sets OPENCODE_PASSWORD; without it the server generates a
    # random password nobody can read, and both clients and probes get 401.
    - secretKey: opencode-password
      remoteRef:
        key: k3s-01-kerenjob-opencode-password
